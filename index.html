<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blackjack Learner</title>
    <link rel="icon" href="favicon.svg?v=20260521-overall-chart" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=20260530-sequential-counting">
    <script src="app.js?v=20260530-sequential-counting" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">21</div>
          <div>
            <h1>Blackjack Learner</h1>
            <p>Dealer-first basic strategy</p>
          </div>
        </div>
        <div class="topbar-actions">
          <a class="repo-link" href="https://github.com/otcan/learn_bj" target="_blank" rel="noopener noreferrer">GitHub repo</a>
          <div class="ruleset" title="Dealer stands on soft 17, multi-deck shoe, double after split allowed, no surrender.">
            S17 | Multi-deck | DAS | No surrender
          </div>
        </div>
      </header>

      <nav class="tabs" aria-label="Primary">
        <button class="tab active" type="button" data-tab="learn">Learn</button>
        <button class="tab" type="button" data-tab="practice">Practice</button>
        <button class="tab" type="button" data-tab="counting">Counting</button>
        <button class="tab" type="button" data-tab="chart">Strategy Chart</button>
      </nav>

      <main id="app" class="app-main" aria-live="polite"></main>

      <footer class="app-footer">
        Educational trainer only. Real tables can use rules that change basic strategy.
      </footer>
    </div>
  </body>
</html>
